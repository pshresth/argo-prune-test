apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.test.local
spec:
  group: test.local
  scope: Namespaced
  names:
    kind: Widget
    plural: widgets
    singular: widget
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                color:
                  type: string
---
apiVersion: v1
kind: Namespace
metadata:
  name: prune-test
---
apiVersion: test.local/v1
kind: Widget
metadata:
  name: widget-keep
  namespace: prune-test
spec:
  color: blue
